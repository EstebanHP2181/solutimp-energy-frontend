# Ejemplo de sitio para energy.solutimp.cl
# NO activar en el servidor real sin confirmación explícita del equipo.
# NO modificar PrestaShop, public_html ni Enersafe.
#
# Puertos internos propuestos:
#   - Frontend (preview o estático): 127.0.0.1:5175
#   - Backend (FastAPI / uvicorn):    127.0.0.1:8010
#
# --- Estrategia recomendada: NO eliminar el prefijo /api ---
#
#   proxy_pass http://127.0.0.1:8010;   (sin barra final ni path)
#
# Con `location /api/` y proxy_pass SIN URI, NGINX reenvía el request_uri completo
# al upstream. Ejemplo del navegador:
#   GET /api/v1/energy/bom/auto  ->  backend recibe  GET /api/v1/energy/bom/auto
#
# EVITAR:
#   proxy_pass http://127.0.0.1:8010/;
# La barra final en el upstream reemplaza el prefijo matched y puede eliminar /api,
# desalineando FastAPI (rutas reales bajo /api/v1/energy/...).
#
# Frontend: VITE_API_BASE_URL=https://energy.solutimp.cl (sin /api al final).
# Llamadas desde el cliente: /api/v1/energy/...  (p. ej. apiUrl('/api/v1/energy/bom/auto')).
#
# SSL: Let's Encrypt / certbot solo cuando DNS resuelva bien. Ver DEPLOY-ENERGY-SUBDOMAIN.md

# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    listen [::]:80;
    server_name energy.solutimp.cl;

    # --- Modo pruebas (opcional): Basic Auth ---
    # auth_basic           "Área restringida";
    # auth_basic_user_file /etc/nginx/.htpasswd-energy;

    client_max_body_size 20m;

    # Backend: conserva /api/... en el URI (proxy_pass sin path)
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:5175/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}

